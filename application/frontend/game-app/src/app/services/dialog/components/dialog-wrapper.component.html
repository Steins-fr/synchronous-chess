<div
    class="rounded-md bg-app-surface-raised text-app-text shadow-md flex flex-col gap-2 p-2 isolate min-w-[300px] max-w-[80vw] relative"
>
    @if (title()) {
    <h1 class="px-4 mx-auto text-2xl lg:text-3xl">{{ title() }}</h1>
    }
    @if (closable()) {
    <!-- Important: Material positions its buttons relative, out of any layer, so above the utilities -->
    <button
        (click)="close.emit()" aria-label="Fermer" class="absolute! top-1 right-1 text-app-text-muted"
        id="dialog-close" mat-icon-button type="button">
        <mat-icon>close</mat-icon>
    </button>
    }

    <ng-container #container></ng-container>
</div>

<nav *transloco="let t; prefix: 'app.nav'" class="flex items-center">
    <a [routerLink]="[ homePath ]" [routerLinkActiveOptions]="{ exact:true }" class="m-2.5"
        routerLinkActive="text-app-link-active">{{ t('home') }}</a>
    <a [routerLink]="[ chessPath ]" class="m-2.5" routerLinkActive="text-app-link-active">{{ t('chess') }}</a>
    <a [routerLink]="[ chatPath ]" class="m-2.5" routerLinkActive="text-app-link-active">{{ t('chat') }}</a>
    <button
        (click)="themeService.toggle()" [attr.aria-label]="themeButton().label | transloco"
        [title]="themeButton().label | transloco" class="ml-auto" id="theme-button" mat-icon-button type="button">
        <mat-icon>{{ themeButton().icon }}</mat-icon>
    </button>
</nav>
<div id="layout">
    <router-outlet></router-outlet>
</div>
<app-api-health-overlay />

<nav *transloco="let t; prefix: 'app'" class="flex shrink-0 items-center">
    <!-- The links of the games hold on a phone of 360 pixels, but in the longest languages: then they scroll, not the page -->
    <div class="flex min-w-0 overflow-x-auto">
        <a [routerLink]="[ homePath ]" [routerLinkActiveOptions]="{ exact:true }" class="nav-link"
            routerLinkActive="text-app-link-active">{{ t('nav.home') }}</a>
        <a [routerLink]="[ chessPath ]" class="nav-link" routerLinkActive="text-app-link-active">{{ t('nav.chess') }}</a>
        <a [routerLink]="[ pokerPath ]" class="nav-link" routerLinkActive="text-app-link-active">{{ t('nav.poker') }}</a>
        <a [routerLink]="[ roulettePath ]" class="nav-link" routerLinkActive="text-app-link-active">{{ t('nav.roulette') }}</a>
        <a [routerLink]="[ chatPath ]" class="nav-link" routerLinkActive="text-app-link-active">{{ t('nav.chat') }}</a>
    </div>
    <!-- The touch target of an icon button exceeds it by 4px: held in the page, it scrolls nothing at its right edge -->
    <div class="ml-auto mr-1 flex shrink-0 items-center">
        <!-- The menu, with the overlay it opens, loads once the app is idle: out of the bundle of its start -->
        @defer (on idle) {
        <app-language-menu />
        } @placeholder {
        <!-- Disabled for the assistive technologies and the tests: a click before the menu loads opens nothing -->
        <button [attr.aria-label]="t('language.pick')" [title]="t('language.pick')" aria-disabled="true" mat-icon-button type="button">
            <mat-icon>translate</mat-icon>
        </button>
        }
        <button
            (click)="themeService.toggle()" [attr.aria-label]="themeButton().label | transloco"
            [title]="themeButton().label | transloco" id="theme-button" mat-icon-button type="button">
            <mat-icon>{{ themeButton().icon }}</mat-icon>
        </button>
    </div>
</nav>
<!-- The page scrolls under the navigation, which stays: the pages of a room hold their chat beside the game -->
<div class="min-h-0 flex-1 overflow-y-auto" id="layout">
    <router-outlet></router-outlet>
</div>
<app-page-loader />

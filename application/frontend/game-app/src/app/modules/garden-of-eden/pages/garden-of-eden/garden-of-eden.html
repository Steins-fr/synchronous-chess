<app-room-layout [dimContent]="false" [game]="game" [room]="room()">
    <app-eden-presentation roomPresentation />
    @if (room(); as myRoom) {
    <app-eden-table #edenTable [room]="myRoom" />
    <details class="rules-details">
        <summary>{{ 'eden.rules.summary' | transloco }}</summary>
        <app-eden-rules [withTitle]="false" />
    </details>
    } @else {
    <app-eden-rules />
    }
    <!-- The history of the table, in the panel of the room -->
    @if (table(); as table) {
    <app-room-history [currentTitle]="'eden.table.history' | transloco" [current]="table.history()"
        [pastTitle]="'eden.table.pastGames' | transloco" [past]="table.pastResults()" roomHistory />
    }
</app-room-layout>

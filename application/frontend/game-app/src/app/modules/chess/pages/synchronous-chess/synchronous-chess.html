<app-room-layout [maxPlayer]="maxPlayer" [dimContent]="false">
    <app-chess-presentation roomPresentation />
    @if (room(); as myRoom) {
    <app-debug-webrtc [room]="myRoom"/>
    <app-chat [room]="myRoom" />
    <app-sync-chess-game [room]="myRoom" />
    <details class="rules">
        <summary>Règles du jeu</summary>
        <app-chess-rules [withTitle]="false" />
    </details>
    } @else {
    <app-chess-rules />
    }
</app-room-layout>

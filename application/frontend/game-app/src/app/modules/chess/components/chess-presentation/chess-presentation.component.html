<section *transloco="let t; prefix: 'chess.presentation'" class="presentation">
    <div class="description">
        <h1>{{ t('title') }}</h1>
        <p class="tagline">{{ t('tagline') }}</p>
        <p>{{ t('intro') }}</p>
        <ul>
            <li>{{ t('points.sameSquare') }}</li>
            <li>{{ t('points.intermediateTurn') }}</li>
            <li>{{ t('points.kingCapture') }}</li>
        </ul>
        <p>{{ t('rooms') }}</p>
    </div>
    <figure class="preview">
        <app-chess-board
            [fenBoard]="board"
            [grabColor]="noColor"
            [movePreview]="preview"
            [validPlayBoard]="validPlays" />
        <figcaption>{{ t('caption') }}</figcaption>
    </figure>
</section>

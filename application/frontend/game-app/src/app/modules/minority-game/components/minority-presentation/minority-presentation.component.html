<section *transloco="let t; prefix: 'minority.presentation'" class="flex flex-col gap-3 p-4">
    <h1 class="m-0 mat-headline-medium">{{ t('title') }}</h1>
    <p class="m-0 mat-title-medium">{{ t('tagline') }}</p>
    <p class="m-0">{{ t('summary') }}</p>
    <ul class="m-0 list-disc pl-6">
        <li>{{ t('points.sealed') }}</li>
        <li>{{ t('points.elimination') }}</li>
        <li>{{ t('points.score') }}</li>
    </ul>
    <p class="m-0">{{ t('rooms') }}</p>
</section>

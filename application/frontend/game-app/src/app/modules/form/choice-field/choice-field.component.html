<fieldset class="m-0 p-0 border-0 min-w-0 flex flex-col gap-1">
    <legend [id]="legendId" class="p-0 mb-1 mat-label-large text-app-text-muted">{{ label() }}</legend>
    <mat-button-toggle-group [attr.aria-labelledby]="legendId" [formField]="field()" hideSingleSelectionIndicator>
        @for (option of options(); track option.value) {
        <mat-button-toggle [value]="option.value">{{ option.label.key | transloco: option.label.params }}</mat-button-toggle>
        }
    </mat-button-toggle-group>
</fieldset>

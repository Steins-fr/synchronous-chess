<section *transloco="let t; prefix: 'home'" class="flex flex-col gap-6 max-w-4xl mx-auto p-4">
    <div class="flex flex-col gap-2">
        <h1 class="m-0 mat-headline-medium">{{ t('title') }}</h1>
        <p class="muted-note">{{ t('intro') }}</p>
    </div>
    <div class="grid gap-4 sm:grid-cols-2">
        <a [routerLink]="chessPath" class="game-card" id="game-card-chess">
            <span aria-hidden="true" class="game-card-visual bg-app-board-light text-app-piece-ink text-[72px]">♞</span>
            <h2 class="m-0 mat-title-large">{{ t('chess.title') }}</h2>
            <p class="muted-note">{{ t('chess.description') }}</p>
            <span class="game-card-action">{{ t('chess.action') }} <mat-icon>arrow_forward</mat-icon></span>
        </a>
        <a [routerLink]="chatPath" class="game-card" id="game-card-chat">
            <!-- Material sizes its icons out of any layer, above the utilities -->
            <span aria-hidden="true" class="game-card-visual bg-app-surface text-app-accent-text">
                <mat-icon class="size-18! text-[72px]!">forum</mat-icon>
            </span>
            <h2 class="m-0 mat-title-large">{{ t('chat.title') }}</h2>
            <p class="muted-note">{{ t('chat.description') }}</p>
            <span class="game-card-action">{{ t('chat.action') }} <mat-icon>arrow_forward</mat-icon></span>
        </a>
    </div>
</section>

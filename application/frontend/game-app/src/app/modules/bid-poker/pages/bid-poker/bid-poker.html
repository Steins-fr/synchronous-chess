<app-room-layout [dimContent]="false" [game]="game" [room]="room()">
    <app-bid-presentation roomPresentation />
    @if (room()) {
    <details class="rules-details">
        <summary>{{ 'bid.rules.summary' | transloco }}</summary>
        <app-bid-rules [withTitle]="false" />
    </details>
    } @else {
    <app-bid-rules />
    }
</app-room-layout>

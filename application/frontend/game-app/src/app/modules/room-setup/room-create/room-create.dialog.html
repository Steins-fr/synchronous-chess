<!-- Validated by the form of the dialog: the browser would show its own message for the required fields -->
<form (submit)="create($event)" *transloco="let t; prefix: 'rooms'" class="flex flex-col gap-2" novalidate>
    <p class="mb-2">{{ t('create.intro') }}</p>
    <app-text-field [field]="createForm.roomName" [label]="t('form.roomName.label')" />
    <app-text-field [field]="createForm.playerName" [label]="t('form.playerName.label')" />
    <app-text-field [field]="createForm.password" [label]="t('form.password.privateRoomLabel')" type="password" />
    <button class="ml-auto min-w-[100px]" id="room-create-submit" mat-flat-button type="submit">{{ t('create.submit') }}</button>
</form>

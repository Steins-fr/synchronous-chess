@if (canDisplay()) {
<div class="flex flex-col p-4 gap-4">
    @if (loading()) {
    <mat-spinner [diameter]="42" />
    } @else {
    <app-open-rooms (joinRoom)="joinOpenRoom($event)" [game]="game()">
        <button (click)="createRoom()" id="room-create" mat-flat-button type="button">Créer une salle</button>
    </app-open-rooms>
    }
</div>
}

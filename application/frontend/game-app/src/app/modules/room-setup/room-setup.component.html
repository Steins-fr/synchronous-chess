@if (canDisplay()) {
<div class="flex flex-col p-4 gap-4">
    <div class="flex gap-4">
        <app-text-field [field]="setupForm.roomName" label="Nom de la salle" />
        <app-text-field [field]="setupForm.playerName" label="Nom du joueur" />
    </div>
    @if (!loading()) {
    <div class="flex items-center gap-4">
        <button (click)="hostRoom()" color="primary" mat-stroked-button>
            Nouvelle
        </button>
        <button (click)="joinRoom()" color="primary" mat-stroked-button>
            Rejoindre
        </button>
    </div>
    }
    @if (loading()) {
    <mat-spinner [diameter]="42" />
    }
</div>
}

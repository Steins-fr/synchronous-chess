<!-- Validated by the form of the dialog: the browser would show its own message for the required fields -->
<form (submit)="join($event)" class="flex flex-col gap-2" novalidate>
    @if (isPrivate()) {
    <p class="mb-2">La salle « {{ roomName() }} » est privée : saisissez votre nom et son mot de passe pour la rejoindre.</p>
    } @else {
    <p class="mb-2">Saisissez votre nom pour rejoindre la salle « {{ roomName() }} ».</p>
    }
    <app-text-field [field]="joinForm.playerName" label="Nom du joueur" />
    @if (isPrivate()) {
    <app-text-field [field]="joinForm.password" label="Mot de passe" type="password" />
    }
    <button class="ml-auto min-w-[100px]" id="room-join-submit" mat-flat-button type="submit">Rejoindre</button>
</form>

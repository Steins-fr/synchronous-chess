<!-- Validated by the form of the dialog: the browser would show its own message for the required fields -->
<form (submit)="join($event)" *transloco="let t; prefix: 'rooms'" class="flex flex-col gap-2" novalidate>
    @if (isPrivate()) {
    <p class="mb-2">{{ t('join.privateIntro', { roomName: roomName() }) }}</p>
    } @else {
    <p class="mb-2">{{ t('join.intro', { roomName: roomName() }) }}</p>
    }
    <app-text-field [field]="joinForm.playerName" [label]="t('form.playerName.label')" />
    @if (isPrivate()) {
    <app-text-field [field]="joinForm.password" [label]="t('form.password.label')" type="password" />
    }
    <button class="ml-auto min-w-[100px]" id="room-join-submit" mat-flat-button type="submit">{{ t('join.submit') }}</button>
</form>

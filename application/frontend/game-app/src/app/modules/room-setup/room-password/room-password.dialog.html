<!-- Validated by the form of the dialog: the browser would show its own message for the required field -->
<form (submit)="join($event)" class="flex flex-col gap-2" novalidate>
    <p class="mb-2">La salle « {{ roomName() }} » est privée : saisissez son mot de passe pour la rejoindre.</p>
    <app-text-field [field]="passwordForm.password" label="Mot de passe" type="password" />
    <button class="ml-auto min-w-[100px]" id="room-password-join" mat-flat-button type="submit">Rejoindre</button>
</form>

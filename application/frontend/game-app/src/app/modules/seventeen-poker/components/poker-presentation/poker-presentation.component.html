<section *transloco="let t; prefix: 'poker.presentation'" class="flex flex-col gap-3 p-4">
    <h1 class="m-0 mat-headline-medium">{{ t('title') }}</h1>
    <p class="m-0 mat-title-medium">{{ t('tagline') }}</p>
    <p class="m-0">{{ t('intro') }}</p>
    <ul class="m-0 list-disc pl-6">
        <li>{{ t('points.shuffle') }}</li>
        <li>{{ t('points.hidden') }}</li>
        <li>{{ t('points.checked') }}</li>
    </ul>
    <p class="m-0">{{ t('rooms') }}</p>
</section>

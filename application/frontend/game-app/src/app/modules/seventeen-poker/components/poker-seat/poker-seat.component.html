<div *transloco="let t; prefix: 'poker.table.seat'"
    class="seat table-seat"
    [class.acting]="acting()">
    <span class="font-medium">{{ name() ?? t('free') }}</span>
    @if (name() !== null) {
    <app-chip-stack #stack [amount]="chips()" />
    <span class="muted-note text-sm">{{ t('chips', { count: chips() }) }}</span>
    }
    @if (gain() > 0) {
    <span class="px-2 rounded-full bg-app-chip text-app-card-ink text-sm font-bold" animate.enter="gain-shown">
        {{ t('gain', { amount: gain() }) }}
    </span>
    }
    @let left = timeLeft();
    @if (left !== null) {
    <span class="ml-auto text-sm font-bold tabular-nums" [class.text-app-clock-low]="left <= clockLow">{{ t('clock', { seconds: left }) }}</span>
    <!-- The clock of the move, emptying over its time -->
    <span class="absolute inset-x-3 bottom-1 h-1 rounded-full bg-app-border" aria-hidden="true">
        <span class="turn-clock block h-full rounded-full bg-app-accent-text" [style.width.%]="clockFill()"></span>
    </span>
    }
    @if (canTake()) {
    <button class="ml-auto" mat-stroked-button type="button" (click)="take.emit()">{{ t('play') }}</button>
    }
    @if (canLeave()) {
    <button class="ml-auto" mat-stroked-button type="button" (click)="leave.emit()">{{ t('leave') }}</button>
    }
    @if (canRelease()) {
    <button class="ml-auto" mat-stroked-button type="button" (click)="release.emit()">{{ t('release') }}</button>
    }
</div>

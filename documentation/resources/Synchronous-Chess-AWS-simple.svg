<?xml version="1.0" encoding="UTF-8"?>
<!--
  Synchronous Chess: the AWS infrastructure at a glance. The detailed diagram, with the options of each service, is
  Synchronous-Chess-AWS.svg, next to this file: both share the palette and the legend.
  Hand-written SVG 1.1: edit the coordinates directly. Colors, one per kind: network and edge (violet), compute
  (orange), data and storage (blue), security and identity (red), external to AWS (slate). A dotted outline marks what
  one stage only deploys: the wake of the database on production, the login of its owner on staging.
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="960" height="828" viewBox="0 0 960 828"
     font-family="Helvetica, Arial, sans-serif">
  <title>Synchronous Chess — AWS infrastructure (overview)</title>
  <desc>The browsers load the Angular app from CloudFront and S3, list the rooms through an HTTP API and join them
    through a WebSocket API of API Gateway, backed by Lambda functions, which store the rooms in Aurora PostgreSQL
    Serverless v2 through the RDS Data API. The game and the chat run between the browsers over WebRTC.</desc>

  <defs>
    <style type="text/css"><![CDATA[
      text { fill: #1f2937; font-size: 10px; }
      .title { font-size: 22px; font-weight: bold; fill: #111827; }
      .subtitle { font-size: 12px; fill: #4b5563; }
      .h { font-size: 12.5px; font-weight: bold; }
      .h2 { font-size: 11px; font-weight: bold; }
      .d { font-size: 10.5px; fill: #374151; }
      .s { font-size: 10px; fill: #374151; }
      .tag { font-size: 9px; fill: #6b7280; letter-spacing: 0.4px; }
      .lbl { font-size: 10.5px; fill: #111827; }
      .lbl-b { font-size: 10.5px; font-weight: bold; fill: #111827; }
      .boundary { font-size: 11px; font-weight: bold; }

      .net { fill: #f4f0ff; stroke: #6d28d9; stroke-width: 1.4; }
      .net-in { fill: #ffffff; stroke: #6d28d9; stroke-width: 1; }
      .net-t { fill: #4c1d95; }
      .cmp { fill: #fff4e8; stroke: #c2410c; stroke-width: 1.4; }
      .only { stroke-dasharray: 2 2; }
      .cmp-group { fill: #fffaf4; stroke: #c2410c; stroke-width: 1.2; stroke-dasharray: 5 3; }
      .cmp-t { fill: #9a3412; }
      .dat { fill: #eaf2ff; stroke: #1d4ed8; stroke-width: 1.4; }
      .dat-t { fill: #1e3a8a; }
      .sec { fill: #fdeeee; stroke: #b91c1c; stroke-width: 1.4; }
      .sec-t { fill: #7f1d1d; }
      .ext { fill: #f1f5f9; stroke: #475569; stroke-width: 1.4; }
      .ext-group { fill: #f8fafc; stroke: #475569; stroke-width: 1.2; stroke-dasharray: 5 3; }
      .ext-t { fill: #1e293b; }
      .minor { stroke-width: 1; }

      .aws { fill: #fcfcfd; stroke: #232f3e; stroke-width: 1.6; }
      .aws-t { fill: #232f3e; }

      .flow { fill: none; stroke: #374151; stroke-width: 1.4; }
      .rtc { fill: none; stroke: #be185d; stroke-width: 3.2; }
      .rtc-t { fill: #9d174d; }
    ]]></style>

    <!-- Arrow heads: the end of a line (ah), its start (ah-s), and for the WebRTC link (rtc, rtc-s) -->
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="ah-s" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="9" markerHeight="9"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#374151"/>
    </marker>
    <marker id="rtc" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#be185d"/>
    </marker>
    <marker id="rtc-s" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="12" markerHeight="12"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#be185d"/>
    </marker>
  </defs>

  <!-- Light background, so that the drawing reads on the light and the dark pages of GitHub -->
  <rect x="0" y="0" width="960" height="828" fill="#ffffff"/>

  <!-- ===================================================================== Title -->
  <text x="16" y="34" class="title">Synchronous Chess — AWS infrastructure (overview)</text>
  <text x="16" y="54" class="subtitle">CloudFront serves the app, an HTTP API lists the rooms, a WebSocket API runs them, the browsers play peer to peer · details: Synchronous-Chess-AWS.svg</text>

  <!-- ===================================================================== Players' browsers -->
  <rect x="16" y="80" width="170" height="290" rx="8" class="ext-group"/>
  <text x="28" y="99" class="h ext-t">Players' browsers</text>

  <rect x="28" y="110" width="146" height="54" rx="6" class="ext"/>
  <text x="38" y="130" class="h2 ext-t">Browser · host</text>
  <text x="38" y="146" class="s">creates the room</text>

  <line x1="46" y1="166" x2="46" y2="290" class="rtc" marker-start="url(#rtc-s)" marker-end="url(#rtc)"/>
  <text x="60" y="214" class="lbl-b rtc-t">WebRTC</text>
  <text x="60" y="230" class="s">the game and the chat,</text>
  <text x="60" y="244" class="s">peer to peer</text>

  <rect x="34" y="298" width="146" height="54" rx="6" class="ext"/>
  <rect x="28" y="292" width="146" height="54" rx="6" class="ext"/>
  <text x="38" y="312" class="h2 ext-t">Browser · player</text>
  <text x="38" y="328" class="s">joins, plays or watches</text>

  <!-- ===================================================================== AWS Cloud -->
  <rect x="240" y="76" width="704" height="544" rx="10" class="aws"/>
  <text x="252" y="94" class="boundary aws-t">AWS Cloud</text>

  <!-- The app -->
  <rect x="264" y="104" width="180" height="62" rx="6" class="net"/>
  <text x="276" y="125" class="h net-t">CloudFront</text>
  <text x="276" y="142" class="d">serves the Angular app</text>
  <text x="276" y="156" class="d">over HTTPS</text>

  <rect x="544" y="104" width="172" height="62" rx="6" class="dat"/>
  <text x="556" y="125" class="h dat-t">S3 bucket</text>
  <text x="556" y="142" class="d">the files of the app,</text>
  <text x="556" y="156" class="d">private to CloudFront</text>

  <line x1="186" y1="135" x2="264" y2="135" class="flow" marker-end="url(#ah)"/>
  <text x="213" y="129" class="lbl-b" text-anchor="middle">HTTPS</text>

  <line x1="444" y1="135" x2="544" y2="135" class="flow" marker-end="url(#ah)"/>
  <text x="494" y="129" class="lbl" text-anchor="middle">app files</text>

  <!-- The rooms -->
  <rect x="264" y="206" width="180" height="178" rx="6" class="net"/>
  <text x="276" y="227" class="h net-t">API Gateway</text>
  <text x="276" y="243" class="d">WebSocket API:</text>
  <text x="276" y="257" class="d">the rooms and the</text>
  <text x="276" y="271" class="d">WebRTC signals</text>
  <text x="276" y="291" class="d">HTTP API:</text>
  <text x="276" y="305" class="d">the list of the rooms</text>
  <rect x="274" y="322" width="160" height="50" rx="4" class="net-in"/>
  <text x="284" y="341" class="h2 net-t">@connections</text>
  <text x="284" y="357" class="s">pushes to a browser</text>

  <line x1="186" y1="250" x2="264" y2="250" class="flow" marker-start="url(#ah-s)" marker-end="url(#ah)"/>
  <text x="213" y="244" class="lbl-b" text-anchor="middle">WSS</text>
  <line x1="186" y1="296" x2="264" y2="296" class="flow" marker-end="url(#ah)"/>
  <text x="213" y="290" class="lbl-b" text-anchor="middle">HTTPS</text>

  <rect x="544" y="206" width="172" height="318" rx="8" class="cmp-group"/>
  <text x="556" y="227" class="h cmp-t">Lambda functions</text>
  <rect x="556" y="236" width="148" height="26" rx="5" class="cmp"/>
  <text x="566" y="253" class="h2 cmp-t">onconnect</text>
  <rect x="556" y="264" width="148" height="26" rx="5" class="cmp"/>
  <text x="566" y="281" class="h2 cmp-t">ondisconnect</text>
  <rect x="556" y="292" width="148" height="26" rx="5" class="cmp"/>
  <text x="566" y="309" class="h2 cmp-t">sendmessage</text>
  <rect x="556" y="320" width="148" height="26" rx="5" class="cmp"/>
  <text x="566" y="337" class="h2 cmp-t">ping</text>
  <rect x="556" y="348" width="148" height="26" rx="5" class="cmp"/>
  <text x="566" y="365" class="h2 cmp-t">httpapi</text>
  <rect x="556" y="376" width="148" height="26" rx="5" class="cmp"/>
  <text x="566" y="393" class="h2 cmp-t">migrate</text>
  <rect x="556" y="404" width="148" height="26" rx="5" class="cmp only"/>
  <text x="566" y="421" class="h2 cmp-t">wakedatabase<tspan class="s" font-weight="normal"> · production</tspan></text>
  <rect x="556" y="432" width="148" height="26" rx="5" class="cmp only"/>
  <text x="566" y="449" class="h2 cmp-t">access<tspan class="s" font-weight="normal"> · staging</tspan></text>
  <rect x="556" y="460" width="148" height="26" rx="5" class="cmp only"/>
  <text x="566" y="477" class="h2 cmp-t">wsauthorizer<tspan class="s" font-weight="normal"> · staging</tspan></text>
  <rect x="556" y="488" width="148" height="26" rx="5" class="cmp only"/>
  <text x="566" y="505" class="h2 cmp-t">httpauthorizer<tspan class="s" font-weight="normal"> · staging</tspan></text>

  <!-- One stage only: the wake of the database (production), the login of the owner (staging) -->
  <rect x="788" y="404" width="144" height="46" rx="6" class="net only"/>
  <text x="800" y="422" class="h2 net-t">EventBridge</text>
  <text x="800" y="438" class="s">wakes the database, prod.</text>
  <line x1="788" y1="417" x2="704" y2="417" class="flow" marker-end="url(#ah)"/>
  <rect x="788" y="462" width="144" height="46" rx="6" class="sec only"/>
  <text x="800" y="480" class="h2 sec-t">Cognito</text>
  <text x="800" y="496" class="s">the login of staging</text>
  <polyline points="704,445 752,445 752,485 788,485" class="flow" marker-end="url(#ah)"/>

  <line x1="444" y1="262" x2="544" y2="262" class="flow" marker-end="url(#ah)"/>
  <text x="494" y="256" class="lbl" text-anchor="middle">invoke</text>
  <line x1="544" y1="347" x2="434" y2="347" class="flow" marker-end="url(#ah)"/>
  <text x="494" y="341" class="lbl-b" text-anchor="middle">PostToConnection</text>

  <!-- The database -->
  <rect x="788" y="104" width="144" height="62" rx="6" class="sec"/>
  <text x="800" y="125" class="h sec-t">Secrets Manager</text>
  <text x="800" y="142" class="d">the password of</text>
  <text x="800" y="156" class="d">the database</text>

  <rect x="788" y="206" width="144" height="62" rx="6" class="dat"/>
  <text x="800" y="227" class="h dat-t">RDS Data API</text>
  <text x="800" y="244" class="d">SQL over HTTPS,</text>
  <text x="800" y="258" class="d">no connection kept</text>

  <rect x="788" y="306" width="144" height="78" rx="6" class="dat"/>
  <text x="800" y="326" class="h dat-t">Aurora PostgreSQL</text>
  <text x="800" y="341" class="h2 dat-t">Serverless v2</text>
  <text x="800" y="358" class="d">the rooms · pauses</text>
  <text x="800" y="372" class="d">when nobody plays</text>

  <line x1="716" y1="237" x2="788" y2="237" class="flow" marker-end="url(#ah)"/>
  <text x="752" y="231" class="lbl-b" text-anchor="middle">Data API</text>
  <line x1="860" y1="206" x2="860" y2="166" class="flow" marker-end="url(#ah)"/>
  <text x="868" y="190" class="lbl">password</text>
  <line x1="860" y1="268" x2="860" y2="306" class="flow" marker-end="url(#ah)"/>
  <text x="868" y="291" class="lbl">SQL</text>

  <!-- Also in AWS -->
  <text x="264" y="548" class="tag">ALSO</text>
  <rect x="264" y="556" width="86" height="40" rx="5" class="net minor"/>
  <text x="274" y="573" class="h2 net-t">Route 53</text>
  <text x="274" y="587" class="s">DNS</text>
  <rect x="358" y="556" width="86" height="40" rx="5" class="sec minor"/>
  <text x="368" y="573" class="h2 sec-t">ACM</text>
  <text x="368" y="587" class="s">certificates</text>
  <rect x="452" y="556" width="86" height="40" rx="5" class="sec minor"/>
  <text x="462" y="573" class="h2 sec-t">SSM</text>
  <text x="462" y="587" class="s">the keys</text>
  <rect x="788" y="556" width="144" height="40" rx="5" class="dat minor"/>
  <text x="800" y="573" class="h2 dat-t">CloudWatch</text>
  <text x="800" y="587" class="s">logs, metrics</text>

  <!-- ===================================================================== Deployment -->
  <rect x="544" y="648" width="172" height="62" rx="6" class="ext"/>
  <text x="556" y="669" class="h ext-t">Terraform</text>
  <text x="556" y="685" class="s">GitHub Actions or a local run:</text>
  <text x="556" y="699" class="s">deploys every resource</text>
  <line x1="630" y1="648" x2="630" y2="524" class="flow" marker-end="url(#ah)"/>
  <text x="638" y="590" class="lbl">runs the migrations</text>

  <!-- ===================================================================== Legend -->
  <text x="16" y="756" class="h">Legend</text>

  <rect x="80" y="745" width="16" height="12" rx="2" class="net"/>
  <text x="102" y="755" class="s">network and edge</text>
  <rect x="210" y="745" width="16" height="12" rx="2" class="cmp"/>
  <text x="232" y="755" class="s">compute</text>
  <rect x="296" y="745" width="16" height="12" rx="2" class="dat"/>
  <text x="318" y="755" class="s">data, storage and logs</text>
  <rect x="446" y="745" width="16" height="12" rx="2" class="sec"/>
  <text x="468" y="755" class="s">security and identity</text>
  <rect x="590" y="745" width="16" height="12" rx="2" class="ext"/>
  <text x="612" y="755" class="s">outside AWS</text>
  <rect x="700" y="745" width="24" height="12" rx="2" class="cmp-group"/>
  <text x="730" y="755" class="s">group of resources</text>
  <rect x="846" y="745" width="16" height="12" rx="2" class="cmp only"/>
  <text x="868" y="755" class="s">one stage only</text>

  <line x1="80" y1="784" x2="120" y2="784" class="flow" marker-end="url(#ah)"/>
  <text x="128" y="788" class="s">request or data, labelled with what flows (two heads: both ways)</text>
  <line x1="460" y1="784" x2="500" y2="784" class="rtc" marker-end="url(#rtc)"/>
  <text x="508" y="788" class="s">WebRTC, browser to browser</text>

  <text x="16" y="814" class="s">The options of each service, the regions and the network: Synchronous-Chess-AWS.svg</text>
</svg>

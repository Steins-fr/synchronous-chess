name: Terraform Plan
# Names the stage of the run, and a destruction, which terraform-apply.yml checks before applying its plan
run-name: Terraform Plan ${{ inputs.stage }}${{ inputs.destroy && ' (destroy)' || '' }}

on:
    workflow_dispatch:
        inputs:
            stage:
                # Development is deployed locally (README.md)
                description: "Deployment stage"
                required: true
                type: choice
                options:
                    - production
                    - staging
            destroy:
                description: "Plan the destruction of every resource of the stage, instead of its deployment"
                required: false
                type: boolean
                default: false

permissions:
    id-token: write
    contents: read

# One run at a time per stage, plan or apply: the next one waits rather than failing on the lock of the state, and a
# newer dispatch of the stage replaces the one waiting
concurrency:
    group: terraform-${{ inputs.stage }}
    cancel-in-progress: false

jobs:
    build-and-plan:
        runs-on: ubuntu-24.04
        # The environment of the stage gives the job its role (secret AWS_ROLE_ARN) and the subject its trust checks:
        # production plans from main only, once its reviewer approves
        environment: ${{ inputs.stage }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            # ── Backend build ──────────────────────────────────────────────
            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Get npm cache directory
              id: npm-cache-dir
              shell: bash
              run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

            - name: Cache backend npm dependencies
              uses: actions/cache@v5
              with:
                  path: |
                      ${{ steps.npm-cache-dir.outputs.dir }}
                      application/backend/websocket-api/node_modules
                  key: ${{ runner.os }}-npm-backend-${{ hashFiles('application/backend/websocket-api/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-npm-backend-

            - name: Install backend dependencies
              working-directory: application/backend/websocket-api
              # The dependencies run no install script: none is needed to build
              run: npm ci --ignore-scripts

            - name: Build backend lambdas
              working-directory: application/backend/websocket-api
              run: npm run build

            # ── Frontend build ─────────────────────────────────────────────
            - name: Cache frontend npm dependencies
              uses: actions/cache@v5
              with:
                  path: |
                      ${{ steps.npm-cache-dir.outputs.dir }}
                      application/frontend/game-app/node_modules
                  key: ${{ runner.os }}-npm-frontend-${{ hashFiles('application/frontend/game-app/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-npm-frontend-

            - name: Install frontend dependencies
              working-directory: application/frontend/game-app
              # The dependencies run no install script: none is needed to build
              run: npm ci --ignore-scripts

            - name: Build frontend
              working-directory: application/frontend/game-app
              run: npm run build -- --configuration=${{ inputs.stage }}

            # ── Terraform ──────────────────────────────────────────────────
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4
              with:
                  # The version of terraform-apply.yml and of required_version: a saved plan applies with the Terraform
                  # it was made with only
                  terraform_version: 1.16.4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: eu-west-1

            - name: Terraform Init
              working-directory: infrastructure
              run: |
                  terraform init \
                    -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
                    -backend-config="key=${{ inputs.stage }}/terraform.tfstate" \
                    -backend-config="region=eu-west-1"

            - name: Terraform Validate
              working-directory: infrastructure
              run: terraform validate

            - name: Terraform Plan
              working-directory: infrastructure
              env:
                  # Through the environment, never pasted into the script
                  TF_VAR_main_domain_name: ${{ vars.MAIN_DOMAIN_NAME }}
                  DESTROY: ${{ inputs.destroy }}
              run: |
                  # A destruction is a plan like another: terraform-apply.yml applies it, once its run is checked
                  mode=()
                  if [[ "$DESTROY" == true ]]; then mode=(-destroy); fi
                  terraform plan "${mode[@]}" \
                    -var="stage=${{ inputs.stage }}" \
                    -lock-timeout=5m \
                    -out=tfplan

            - name: Generate plan report
              working-directory: infrastructure
              run: terraform show -no-color tfplan > plan-report.txt

            # ── Job Summary ────────────────────────────────────────────────
            - name: Write plan report to job summary
              working-directory: infrastructure
              env:
                  MAIN_DOMAIN_NAME: ${{ vars.MAIN_DOMAIN_NAME }}
                  DESTROY: ${{ inputs.destroy }}
              run: |
                  echo "## Terraform Plan — \`${{ inputs.stage }}\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Input | Value |" >> $GITHUB_STEP_SUMMARY
                  echo "|---|---|" >> $GITHUB_STEP_SUMMARY
                  echo "| Stage | \`${{ inputs.stage }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| Destroy | \`$DESTROY\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| Domain | \`$MAIN_DOMAIN_NAME\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| State bucket | \`${{ vars.TF_STATE_BUCKET }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| Run ID | \`${{ github.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Plan output" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  cat plan-report.txt >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY

            # ── Artifacts ──────────────────────────────────────────────────
            - name: Upload Terraform plan artifact
              uses: actions/upload-artifact@v7
              with:
                  name: terraform-plan-${{ inputs.stage }}-${{ github.run_id }}
                  # The zips of the lambdas the plan was made with: applying a saved plan does not zip them again
                  path: |
                      infrastructure/tfplan
                      infrastructure/plan-report.txt
                      infrastructure/.out/lambda-api/
                  include-hidden-files: true
                  retention-days: 7

            - name: Upload backend dist artifact
              uses: actions/upload-artifact@v7
              with:
                  name: backend-dist-${{ inputs.stage }}-${{ github.run_id }}
                  path: application/backend/websocket-api/dist/
                  retention-days: 7

            - name: Upload frontend dist artifact
              uses: actions/upload-artifact@v7
              with:
                  name: frontend-dist-${{ inputs.stage }}-${{ github.run_id }}
                  # Where Angular builds the app, and the bucket module of Terraform reads it
                  path: application/frontend/game-app/dist/game-app/browser/
                  retention-days: 7

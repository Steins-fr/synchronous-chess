name: Terraform Apply
# Shows a destruction on the approval of the environment, before any step runs
run-name: Terraform Apply ${{ inputs.stage }}${{ inputs.destroy && ' (destroy)' || '' }}

on:
    workflow_dispatch:
        inputs:
            plan_run_id:
                description: "Run ID of the Terraform Plan workflow to apply (see plan job summary)"
                required: true
                type: string
            stage:
                description: "Deployment stage (must match the stage used in the plan run)"
                required: true
                type: choice
                options:
                    - production
                    - staging
            destroy:
                description: "Apply a plan of the destruction of the stage (must match the plan run)"
                required: false
                type: boolean
                default: false

permissions:
    id-token: write
    contents: read
    actions: read

# One run at a time per stage, plan or apply: the next one waits rather than failing on the lock of the state, and a
# newer dispatch of the stage replaces the one waiting
concurrency:
    group: terraform-${{ inputs.stage }}
    cancel-in-progress: false

jobs:
    apply:
        runs-on: ubuntu-24.04
        environment: ${{ inputs.stage }}
        steps:
            # Applies a plan of terraform-plan.yml only, dispatched in this repository for the same stage, and for
            # production planned from a commit of main: any run can upload an artifact of the expected name. Its commit
            # is checked out, whose migrations and provider lock file the apply reads again
            - name: Check the plan run
              id: plan-run
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  PLAN_RUN_ID: ${{ inputs.plan_run_id }}
                  STAGE: ${{ inputs.stage }}
                  DESTROY: ${{ inputs.destroy }}
              run: |
                  [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::plan_run_id is not the ID of a run"; exit 1; }
                  run=$(gh api "repos/$REPOSITORY/actions/runs/$PLAN_RUN_ID")
                  # The title of a plan of the stage, of a destruction only when this apply says so: a deployment never
                  # applies a destruction by a wrong run ID, nor the reverse
                  title="Terraform Plan $STAGE"
                  if [[ "$DESTROY" == true ]]; then title+=" (destroy)"; fi
                  jq -e --arg repository "$REPOSITORY" --arg title "$title" '
                    .path == ".github/workflows/terraform-plan.yml" and .event == "workflow_dispatch"
                    and .conclusion == "success" and .head_repository.full_name == $repository
                    and .display_title == $title' <<<"$run" > /dev/null \
                    || { echo "::error::Run $PLAN_RUN_ID is not a successful run named $title in this repository"; exit 1; }
                  echo "title=$title" >> "$GITHUB_OUTPUT"
                  sha=$(jq -r .head_sha <<<"$run")
                  if [[ "$STAGE" == production ]]; then
                    # A commit of the branch main, not only of a ref named main: a tag main would pass the name. The
                    # branches endpoint, unlike a ref name, never resolves to a tag
                    main=$(gh api "repos/$REPOSITORY/branches/main" --jq .commit.sha)
                    status=$(gh api "repos/$REPOSITORY/compare/$sha...$main" --jq .status)
                    [[ "$(jq -r .head_branch <<<"$run")" == main && ( "$status" == identical || "$status" == ahead ) ]] \
                      || { echo "::error::Run $PLAN_RUN_ID did not plan a commit of main"; exit 1; }
                  fi
                  echo "sha=$sha" >> "$GITHUB_OUTPUT"

            - name: Checkout
              uses: actions/checkout@v6
              with:
                  ref: ${{ steps.plan-run.outputs.sha }}
                  persist-credentials: false

            # ── Restore build artifacts from plan run ──────────────────────
            - name: Download Terraform plan artifact
              uses: actions/download-artifact@v8
              with:
                  name: terraform-plan-${{ inputs.stage }}-${{ inputs.plan_run_id }}
                  path: infrastructure/
                  run-id: ${{ inputs.plan_run_id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download backend dist artifact
              uses: actions/download-artifact@v8
              with:
                  name: backend-dist-${{ inputs.stage }}-${{ inputs.plan_run_id }}
                  path: application/backend/websocket-api/dist/
                  run-id: ${{ inputs.plan_run_id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Download frontend dist artifact
              uses: actions/download-artifact@v8
              with:
                  name: frontend-dist-${{ inputs.stage }}-${{ inputs.plan_run_id }}
                  # Where Angular builds the app, and the bucket module of Terraform reads it
                  path: application/frontend/game-app/dist/game-app/browser/
                  run-id: ${{ inputs.plan_run_id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            # ── Terraform ──────────────────────────────────────────────────
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4
              with:
                  # The version of terraform-plan.yml and of required_version: a saved plan applies with the Terraform
                  # it was made with only
                  terraform_version: 1.16.4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: eu-west-1
                  # A first apply creates the Aurora cluster and the CloudFront distribution: the two hours the
                  # max_session_duration of the role allows
                  role-duration-seconds: 7200

            - name: Terraform Init
              working-directory: infrastructure
              run: |
                  terraform init \
                    -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
                    -backend-config="key=${{ inputs.stage }}/terraform.tfstate" \
                    -backend-config="region=eu-west-1"

            # ── Show plan before applying ──────────────────────────────────
            - name: Show plan report
              working-directory: infrastructure
              env:
                  PLAN_RUN_ID: ${{ inputs.plan_run_id }}
                  PLAN_RUN_TITLE: ${{ steps.plan-run.outputs.title }}
              run: |
                  echo "## Terraform Apply — \`${{ inputs.stage }}\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Input | Value |" >> $GITHUB_STEP_SUMMARY
                  echo "|---|---|" >> $GITHUB_STEP_SUMMARY
                  echo "| Stage | \`${{ inputs.stage }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| Plan run ID | \`$PLAN_RUN_ID\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| Plan run | \`$PLAN_RUN_TITLE\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| State bucket | \`${{ vars.TF_STATE_BUCKET }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Plan that will be applied" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  cat plan-report.txt >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY

            - name: Terraform Apply
              working-directory: infrastructure
              run: terraform apply -auto-approve -lock-timeout=5m tfplan

name: Backend CI Pull request WebSocket API

on:
    pull_request:
        paths:
            - "application/backend/websocket-api/**"
            - "application/shared/**"

defaults:
    run:
        working-directory: application/backend/websocket-api

jobs:
    websocket-api-lint:
        if: github.event.pull_request.draft == false
        timeout-minutes: 5
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - uses: actions/setup-node@v5
              with:
                  node-version: 24

            - name: Get npm cache directory
              id: npm-cache-dir
              shell: bash
              run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

            - uses: actions/cache@v5
              with:
                  path: |
                      ${{ steps.npm-cache-dir.outputs.dir }}
                      **/node_modules
                  key: ${{ runner.os }}-websocket-api-npm-${{ hashFiles('application/backend/websocket-api/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-websocket-api-npm-

            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint
